spring.application.name=timecraft

# Datenbank (Entwicklung): PostgreSQL aus docker-compose.yml. Nur Entwicklungswerte, nicht geheim.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/timecraft
spring.datasource.username=timecraft
spring.datasource.password=timecraft

# Schema wird aus den Entities erzeugt (kein Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Anmeldung (M1): Demo-Daten beim ersten Start (leere Tabelle benutzer), u. a. admin, projektleitung,
# mitarbeiter mit diesem Entwicklungspasswort. Nicht geheim, nur fuer die lokale Demo.
timecraft.demo.passwort=timecraft1

# E-Mail-Versand der Einmalpasswoerter (M1). Zugangsdaten nie im Repository, sondern entweder als
# Umgebungsvariablen (MAIL_HOST, MAIL_PORT, MAIL_USER, MAIL_PASSWORD, MAIL_ABSENDER) oder in der Datei
# ~/.timecraft/mail.properties ausserhalb des Projektordners (gleiche Namen, z. B. MAIL_USER=...).
# Im Profil "fake" wird keine E-Mail verschickt, sondern nur ins Log geschrieben.
spring.config.import=optional:file:${user.home}/.timecraft/mail.properties
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
# Anmeldung am Mailserver und verschluesselte Verbindung (STARTTLS), z. B. fuer GMX (mail.gmx.net, Port 587)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
timecraft.mail.absender=${MAIL_ABSENDER:timecraft@localhost}

# Sitzung endet nach 30 Minuten ohne Aktivitaet (auch bei offener Seite)
server.servlet.session.timeout=30m
vaadin.closeIdleSessions=true
