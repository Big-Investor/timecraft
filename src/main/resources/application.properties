spring.application.name=timecraft

# Datenbank (Entwicklung): PostgreSQL aus docker-compose.yml. Nur Entwicklungswerte, nicht geheim.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/timecraft
spring.datasource.username=timecraft
spring.datasource.password=timecraft

# Schema wird aus den Entities erzeugt (kein Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Anmeldung: Platzhalter-Benutzer (mitarbeiter, projektleitung, admin) mit diesem Entwicklungspasswort
timecraft.platzhalter.passwort=timecraft

# Sitzung endet nach 30 Minuten ohne Aktivitaet (auch bei offener Seite)
server.servlet.session.timeout=30m
vaadin.closeIdleSessions=true
